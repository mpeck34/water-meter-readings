<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Mockup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Style for the connection indicator */
        .connection-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: red;
            position: fixed;
            top: 10px;
            right: 10px;
            transition: background-color 0.3s ease;
        }

        .connected {
            background-color: green;
        }
    </style>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
</head>
<body>
    <div class="container mt-5">
        <h1>App Mockup</h1>
        <button id="advance" class="btn btn-primary">Go to Meter List</button>
    </div>

    <!-- Connection indicator -->
    <div id="connectionIndicator" class="connection-indicator"></div>

    <script>
        // Function to check backend connection
        function checkBackendConnection() {
            fetch('/check_connection')  // Replace with your backend URL
                .then(response => {
                    if (response.ok) {
                        document.getElementById('connectionIndicator').classList.add('connected');
                    } else {
                        document.getElementById('connectionIndicator').classList.remove('connected');
                    }
                })
                .catch(() => {
                    document.getElementById('connectionIndicator').classList.remove('connected');
                });
        }

        // Check the connection on page load
        window.onload = checkBackendConnection;

        // Add event listener to the button for navigation
        document.getElementById('advance').addEventListener('click', function() {
            // Redirect to meterList.html when the button is clicked
            window.location.href = '/static/meterList.html';
            // window.location.href = '/meterList';
        });
    </script>
</body>
</html>
