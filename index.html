<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Mockup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>App Mockup</h1>
        <button id="fetchData" class="btn btn-primary">Go to Meter List</button>
    </div>

    <script>
        // Add event listener to the button for navigation
        document.getElementById('fetchData').addEventListener('click', function() {
            // Redirect to meterList.html when the button is clicked
            window.location.href = 'meterList.html';
        });
    </script>

</body>
</html>
