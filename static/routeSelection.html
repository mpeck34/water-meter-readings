<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            background-color: darkred;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
        }
        .route-list {
            display: flex;
            flex-direction: column; /* Stack items vertically */
            gap: 10px; /* Space between items */
            padding: 20px;
        }
        /* Style for each route item bubble */
        .route-item {
            background-color: #f0f0f0;
            padding: 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s ease;
            border: 1px solid #ccc;
        }

        .route-item:hover {
            background-color: #e0e0e0;
        }

        /* Optional: Style for the route details inside each bubble */
        .route-info {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="top-bar">Select a Route</div>

    <main>
        <section id="route-list" class="route-list">
            <!-- Routes will be dynamically populated here -->
        </section>
    </main>

    <script src="js/routeManager.js"></script>

</body>
</html>
